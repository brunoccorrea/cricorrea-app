<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182e4e"><title>Pagamento PIX | CRICORREA</title><style>:root{--navy:#182e4e;--orange:#f26522;--green:#0f766e;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef3f9,#fff);font-family:Arial,sans-serif;color:#172033;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#fff;border-radius:18px;box-shadow:0 18px 55px #182e4e22;overflow:hidden}.head{background:var(--navy);color:#fff;padding:22px}.head b{display:block;font-size:1.45rem}.head span{color:#ff8a4c;font-size:.8rem;font-weight:800}.body{padding:20px}.hello{font-size:1.05rem;font-weight:800;color:var(--navy)}.amount{background:#ecfdf5;border:1px solid #86efac;border-radius:12px;padding:15px;margin:14px 0;text-align:center}.amount small{display:block;color:#475569;font-weight:700}.amount strong{display:block;color:#166534;font-size:1.8rem;margin-top:4px}.label{font-size:.72rem;text-transform:uppercase;color:#64748b;font-weight:800;margin-bottom:5px}.key{font-family:monospace;background:#f8fafc;border:2px dashed #94a3b8;border-radius:10px;padding:14px;text-align:center;font-size:1.2rem;letter-spacing:.5px;word-break:break-all}.btn{width:100%;border:0;border-radius:10px;padding:14px;margin-top:12px;background:var(--green);color:#fff;font-size:1rem;font-weight:900;cursor:pointer}.btn:active{transform:scale(.99)}.msg{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#dcfce7;color:#166534;text-align:center;font-weight:800}.foot{font-size:.76rem;color:#64748b;text-align:center;line-height:1.45;margin-top:14px}.invalid{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px}</style></head><body><main class="card"><header class="head"><b>CRICORREA</b><span>MARIDO DE ALUGUEL</span></header><section class="body"><div id="content"><div class="hello" id="hello">Pagamento via PIX</div><div class="amount"><small>Valor para pagamento</small><strong id="amount">R$ 0,00</strong></div><div class="label">Chave PIX CNPJ</div><div class="key" id="key">51157076000166</div><button class="btn" id="copy">📋 Copiar chave PIX</button><div class="msg" id="msg">✅ Chave copiada! Agora cole no aplicativo do banco.</div><div class="foot" id="reference"></div><div class="foot">Confira o favorecido no aplicativo do banco antes de confirmar o pagamento. Depois, envie o comprovante pela conversa do WhatsApp.</div></div></section></main><script>const q=new URLSearchParams(location.search),key=(q.get('key')||'51157076000166').replace(/\D/g,''),amount=Number(q.get('amount')||0),client=q.get('client')||'',budget=q.get('budget')||'';document.getElementById('key').textContent=key;document.getElementById('amount').textContent=amount.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});document.getElementById('hello').textContent=client?`Olá, ${client}! Pagamento via PIX`:'Pagamento via PIX';document.getElementById('reference').textContent=budget?`Referência: orçamento ${budget}`:'';async function copy(){try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(key);else{const t=document.createElement('textarea');t.value=key;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('msg').style.display='block';document.getElementById('copy').textContent='✅ Chave PIX copiada';}catch(e){document.getElementById('msg').textContent='Não foi possível copiar automaticamente. Toque sobre a chave e selecione Copiar.';document.getElementById('msg').style.display='block'}}document.getElementById('copy').addEventListener('click',copy);</script></body></html>
